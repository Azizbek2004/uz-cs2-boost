<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UZ CS2 Boost - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: white;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 400px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6b00, #cc5500);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ff6b00;
    }
    p {
      color: #888;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #ff6b00, #cc5500);
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">UZ</div>
    <h1>You're Offline</h1>
    <p>Some features like the Spray Simulator work offline. Connect to the internet for full access to ping diagnostics, leaderboards, and community features.</p>
    <a href="/spray-simulator">Open Spray Simulator</a>
  </div>
</body>
</html>
