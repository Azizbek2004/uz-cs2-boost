# ============================================================================
# UZ CS2 Boost — Nginx FastDL Configuration
# This serves CS2 game assets (maps, models, materials) via HTTP
# so clients can download custom content when connecting.
#
# Place this file at: /etc/nginx/sites-available/fastdl
# Then: ln -s /etc/nginx/sites-available/fastdl /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx
#
# CLOUDFLARE SETUP:
# 1. Point your domain DNS (cdn.uzcs2boost.com) to this server's IP (194.37.80.182)
# 2. Enable Cloudflare proxy (orange cloud) on the DNS record
# 3. In Cloudflare Dashboard → Caching → Cache Rules, create a rule:
#    - URI Path "contains" /fastdl/
#    - Cache eligibility: Eligible for cache
#    - Edge TTL: 7 days
#    - Browser TTL: 1 day
# 4. In Cloudflare Dashboard → Speed → Optimization → Content Optimization:
#    - Enable Brotli compression
# ============================================================================

server {
    listen 80;
    server_name cdn.uzcs2boost.com;

    # ── FastDL: Serve CS2 game files ───────────────────────────────────────
    location /fastdl/ {
        alias /home/steam/cs2-ds/game/csgo/;

        # Only allow downloads of game asset files
        location ~* \.(bsp|bz2|nav|ain|vtf|vmt|mdl|vvd|vtx|phy|png|jpg|wav|mp3)$ {
            # CORS headers for Cloudflare and game client compatibility
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD";
            add_header Access-Control-Allow-Headers "Range";

            # Cache control headers (Cloudflare will respect these)
            add_header Cache-Control "public, max-age=604800"; # 7 days
            add_header X-Content-Type-Options "nosniff";

            # Correct MIME types for compressed map files
            types {
                application/x-bzip2 bz2;
                application/octet-stream bsp nav ain mdl vvd vtx phy;
                image/x-vtf vtf;
                text/plain vmt;
                image/png png;
                image/jpeg jpg;
                audio/wav wav;
                audio/mpeg mp3;
            }

            # Enable sendfile for efficient static file serving
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
        }

        # Block directory listing and non-asset requests
        autoindex off;
        return 403;
    }

    # ── Skin images: Serve skin catalog images ─────────────────────────────
    location /images/ {
        alias /home/steam/skin-images/;

        # CORS + Cache headers
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=2592000"; # 30 days

        # Only serve image files
        location ~* \.(png|jpg|jpeg|webp|gif)$ {
            try_files $uri =404;
        }

        autoindex off;
        return 403;
    }

    # ── Health check endpoint ──────────────────────────────────────────────
    location /health {
        return 200 '{"status":"ok","service":"uz-cs2-boost-cdn"}';
        add_header Content-Type application/json;
    }

    # ── Block everything else ──────────────────────────────────────────────
    location / {
        return 404;
    }
}
